name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # pi provides these at runtime; the latest versions make the check catch pi API changes
      - run: npm install --no-save --no-package-lock typescript @types/node @earendil-works/pi-coding-agent @earendil-works/pi-ai @earendil-works/pi-tui typebox
      - run: npm install --prefix packages/pi-polish --omit=peer --no-package-lock
      - run: npx tsc -p .
